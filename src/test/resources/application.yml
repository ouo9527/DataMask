ouo:
  desens:
    #是否开启脱敏，默认true即开启
    #enabled: true
    # 脱敏规则（key键为字段名，value值为对应的脱敏规则）
    rules:
      addr:
        mode: empty
      #字段名
      name:
        #脱敏模式：置空empty、哈希hash、正则regex、替换repl、掩盖mask
        mode: mask
        #敏感类型，采用内置脱敏配置
        type: full_name
      phone:
        mode: repl
        #按位置（从左往右）进行替换
        posns:
          #i表示位置索引
          - i: 3
          - i: 8
            #是否固定值，默认true，false为随机值
            fixed: true
            #替换值
            rv: "#"
        #剩余位置
        surplus:
          fixed: false
      id_card:
        mode: hash
        #算法
        algorithm: sm3
        #盐
        salt: grvyw$2
      ip:
        mode: regex
        #正则表达式，注：yml配置中无需使用\转义符，只需符合正则语法即可，但properties配置文件中正则特殊符号最好使用1个反斜杠进行转义
        pattern: (\d{1,}.).*(.\d{1,})
        rv: $1****$2
      acct_name:
        mode: mask
        type: full_name

